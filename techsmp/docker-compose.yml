# 生電服 TechSMP (Fabric 26.3 + Carpet + Servux)
# 規劃依據:/mnt/catjj/jay/mcs/reports/生電服 Litematica 伺服器規劃.md
# 主機相關的值(UID/GID、port、記憶體)由同目錄的 .env 設定，見 .env.example;部署到新主機請看 部署說明.md。
# 設定檔以 Git repo 為準:./config(生存服)、./mirror-config(鏡像服)每次啟動都會覆蓋 data/config 裡的同名檔案。
# 在遊戲內用指令改的設定，重啟後會被蓋回 repo 版本 —— 要改請改 repo 再重啟。
x-mc-common: &mc-common
  image: itzg/minecraft-server:latest
  restart: unless-stopped
  tty: true
  stdin_open: true

services:
  mc:
    <<: *mc-common
    container_name: mc-techsmp
    ports:
      - "${MC_PORT:-25566}:25565"
      - "127.0.0.1:${MC_MAP_LOCAL_PORT:-18123}:8080"
    mem_limit: ${MC_MEM_LIMIT:-13g}
    environment:
      EULA: "TRUE"
      TZ: Asia/Taipei
      UID: ${MC_UID:-1002}
      GID: ${MC_GID:-1002}
      TYPE: FABRIC
      VERSION: "26.3"
      FABRIC_LOADER_VERSION: "0.20.1"
      MEMORY: ${MC_MEMORY:-10G}
      USE_AIKAR_FLAGS: "true"
      MOTD: "TechSMP 26.3 | Fabric + Carpet + Servux"
      MODE: survival
      DIFFICULTY: hard
      MAX_PLAYERS: 10
      VIEW_DISTANCE: 10
      # 農場依此設計，定案後不要再改
      SIMULATION_DISTANCE: 10
      SPAWN_PROTECTION: 0
      ONLINE_MODE: "true"
      ENABLE_WHITELIST: "false"
      RESOURCE_PACK: "https://cdn.modrinth.com/data/J4cajZTT/versions/V7mMLusx/ModernArch%20v4.7.2%20%5B26.3%5D%20%5B128x%5D.zip"
      RESOURCE_PACK_SHA1: "31e41f10829296076cda7c5e30983068076aafe6"
      RESOURCE_PACK_ENFORCE: "false"
      OPS: |
        TsengJay0402
      # 0 = 沒人在線也不暫停，掛機農場持續運作
      PAUSE_WHEN_EMPTY_SECONDS: "0"
      ENABLE_RCON: "true"
      RCON_PASSWORD: "${RCON_PASSWORD}"
      ENABLE_ROLLING_LOGS: "true"
      # ./config 永遠覆蓋 data/config(itzg 預設會略過目的地較新的檔案)
      SYNC_SKIP_NEWER_IN_DESTINATION: "false"
      # 版本釘死(Modrinth version ID,2026-11-17 查證),避免重啟時自動升級導致客戶端對不上
      MODRINTH_DOWNLOAD_DEPENDENCIES: required
      MODS: |
        https://edge.forgecdn.net/files/9712/118/lodeways-fabric-26.3-1.20.0.jar
        https://edge.forgecdn.net/files/9372/945/Backpackery-2.3.5-mc26.3-fabric.jar
      MODRINTH_PROJECTS: |
        fabric-api:Zns5SSRA
        fabric-language-kotlin:SKW1BTL3
        carpet:yt9oDFOj
        carpet-tis-addition:Zo8yy53j
        servux:azA4UG3T
        syncmatica:uT7TJ2Wp
        lithium:fWv5bnZk
        ferrite-core:d5ddUdiB
        ledger:pxv5cN0d
        chunky:86FKD9qx
        veinminer:T4so6NOu
        elytra-armor:Oe6DS1BQ
        squaremap:YPMtDS9D
        flan:dAcEMeRZ
    volumes:
      - ./data:/data
      - ./config:/config:ro
      - ./datapacks/flan-owner-flight:/data/world/datapacks/flan-owner-flight:ro
      - ./datapacks/backpackery-recipe-unlock:/data/world/datapacks/backpackery-recipe-unlock:ro

  # 創造鏡像服：世界由 refresh-mirror.sh 從生存服同步過來，用來測機器、用 Servux 帶 NBT 快速貼投影
  mirror:
    <<: *mc-common
    container_name: mc-techsmp-mirror
    ports:
      - "${MIRROR_PORT:-25567}:25565"
    mem_limit: ${MIRROR_MEM_LIMIT:-8g}
    environment:
      EULA: "TRUE"
      TZ: Asia/Taipei
      UID: ${MC_UID:-1002}
      GID: ${MC_GID:-1002}
      TYPE: FABRIC
      VERSION: "26.3"
      FABRIC_LOADER_VERSION: "0.20.1"
      MEMORY: ${MIRROR_MEMORY:-6G}
      USE_AIKAR_FLAGS: "true"
      MOTD: "TechSMP Mirror (creative)"
      MODE: creative
      FORCE_GAMEMODE: "true"
      DIFFICULTY: hard
      MAX_PLAYERS: 10
      VIEW_DISTANCE: 10
      SIMULATION_DISTANCE: 10
      SPAWN_PROTECTION: 0
      ONLINE_MODE: "true"
      ENABLE_WHITELIST: "false"
      OPS: |
        TsengJay0402
      PAUSE_WHEN_EMPTY_SECONDS: "0"
      ENABLE_ROLLING_LOGS: "true"
      SYNC_SKIP_NEWER_IN_DESTINATION: "false"
      MODRINTH_DOWNLOAD_DEPENDENCIES: required
      MODS: |
        https://edge.forgecdn.net/files/9712/118/lodeways-fabric-26.3-1.20.0.jar
        https://edge.forgecdn.net/files/9372/945/Backpackery-2.3.5-mc26.3-fabric.jar
      MODRINTH_PROJECTS: |
        fabric-api:Zns5SSRA
        carpet:yt9oDFOj
        carpet-tis-addition:Zo8yy53j
        servux:azA4UG3T
        syncmatica:uT7TJ2Wp
        lithium:fWv5bnZk
        ferrite-core:d5ddUdiB
        elytra-armor:Oe6DS1BQ
    volumes:
      - ./mirror-data:/data
      - ./mirror-config:/config:ro

  backup:
    image: itzg/mc-backup
    container_name: mc-techsmp-backup
    restart: unless-stopped
    hostname: techsmp-backup
    depends_on: [mc]
    environment:
      TZ: Asia/Taipei
      RCON_HOST: mc
      RCON_PASSWORD: "${RCON_PASSWORD}"
      BACKUP_METHOD: tar
      TAR_COMPRESS_METHOD: zstd
      BACKUP_INTERVAL: "3h"
      INITIAL_DELAY: "5m"
      PRUNE_BACKUPS_DAYS: 14
    volumes:
      - ./data:/data:ro
      - ./backups:/backups
