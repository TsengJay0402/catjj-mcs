# TechSMP 客戶端模組包
# - 改到 techsmp/client/ 時：檢查 modrinth.index.json 是否和 mods.txt 一致，並把 .mrpack 放在 Actions artifact
# - 推 tag techsmp-client-v<版本>(要和 pack.json 的 version 相同):自動建立 GitHub Release 並附上 .mrpack
name: TechSMP client pack

on:
  push:
    branches: [main]
    paths:
      - "techsmp/client/**"
      - "tools/build-mrpack.py"
      - "tools/build-curseforge.py"
      - ".github/workflows/techsmp-client.yml"
    tags: ["techsmp-client-v*"]
  pull_request:
    paths:
      - "techsmp/client/**"
      - "tools/build-mrpack.py"
      - "tools/build-curseforge.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check index is up to date
        run: python3 tools/build-mrpack.py techsmp/client --check

      - name: Check tag matches pack version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v=$(python3 -c "import json;print(json.load(open('techsmp/client/pack.json'))['version'])")
          if [ "${GITHUB_REF_NAME#techsmp-client-v}" != "$v" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} 和 pack.json version ${v} 不一致"; exit 1
          fi

      - name: Build mrpack
        run: python3 tools/build-mrpack.py techsmp/client --out dist

      - uses: actions/upload-artifact@v7
        with:
          name: TechSMP-mrpack
          path: dist/*.mrpack

      # 給 CurseForge App 匯入的 zip;需要 repo secret CURSEFORGE_API_KEY,沒設定就略過
      - name: Build CurseForge zip
        if: startsWith(github.ref, 'refs/tags/')
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: |
          if [ -z "$CURSEFORGE_API_KEY" ]; then
            echo "::warning::沒有設定 CURSEFORGE_API_KEY secret,這次不產生 CurseForge 包"
            exit 0
          fi
          python3 tools/build-curseforge.py techsmp/client --out dist

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.mrpack
            dist/*-curseforge.zip
          generate_release_notes: true

      # Prism + packwiz-installer 從這個分支讀 pack.toml,只有發佈 tag 才更新，main 上未發佈的改動不會推到玩家
      - name: Publish packwiz branch
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist/packwiz
          git init -q -b techsmp-client-pack
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "TechSMP client pack ${GITHUB_REF_NAME}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:techsmp-client-pack
