services:
  mc:
    image: itzg/minecraft-server:latest
    container_name: mc-pekora
    restart: unless-stopped
    tty: true
    stdin_open: true
    ports:
      - "25565:25565"
    environment:
      EULA: "TRUE"
      TZ: Asia/Taipei
      # 讓 /data 內檔案屬於 jay，方便直接編輯
      UID: 1002
      GID: 1002

      # Pekora 地圖(原 1.20.4 存檔，2026-11-16 升到 26.3;原始檔備份在 ../zips/pekora_minecraft.zip)
      # 版本固定，避免自動升級後客戶端/Litematica 對不上
      TYPE: PAPER
      VERSION: "26.3"
      MEMORY: 10G
      USE_AIKAR_FLAGS: "true"

      MOTD: "Pekora Creative 26.3"
      MODE: creative
      FORCE_GAMEMODE: "true"
      DIFFICULTY: peaceful
      SPAWN_PROTECTION: 0
      MAX_PLAYERS: 8
      VIEW_DISTANCE: 10
      SIMULATION_DISTANCE: 6
      OPS: |
        TsengJay0402
      ENABLE_ROLLING_LOGS: "true"
      MODRINTH_PROJECTS: |
        worldedit
    volumes:
      - ./data:/data
